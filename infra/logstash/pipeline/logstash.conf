input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [@timestamp] {
    date {
      match => ["@timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
  mutate {
    add_field => { "[@metadata][index]" => "agendamiento-%{+YYYY.MM.dd}" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][index]}"
  }
}
