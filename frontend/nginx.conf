server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver de Docker — fuerza a nginx a re-resolver "backend" en cada
    # request en vez de cachear la IP al arranque. Esto evita 502 cuando el
    # contenedor backend cambia de IP después de un rebuild.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Usar una variable obliga a nginx a resolver el hostname en runtime.
        set $backend_host backend;
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
